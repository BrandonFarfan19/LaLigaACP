# Base de datos y backend de La Liga ACP.
# Credenciales en .env (copiar desde .env.example). Esquema: EsquemaBD.md.
services:
  db:
    image: mysql:8.4
    container_name: la-liga-acp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?definir MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?definir MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definir MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir MYSQL_ROOT_PASSWORD en .env}
      TZ: UTC
    command:
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Modo desarrollo: código montado desde el host, nodemon (--legacy-watch,
  # por polling) recarga en cada cambio (ver server/Dockerfile). DB_HOST/DB_PORT se pisan aquí a propósito:
  # dentro de la red de compose el destino es el servicio db en su puerto
  # interno fijo (3306), sin importar qué publique MYSQL_PORT en el host.
  server:
    build:
      context: ./server
    container_name: la-liga-acp-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:?definir CORS_ORIGIN en .env}
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?definir MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?definir MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definir MYSQL_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?definir SESSION_SECRET en .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      REGISTER_RATE_LIMIT_WINDOW_MS: ${REGISTER_RATE_LIMIT_WINDOW_MS:-3600000}
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-10}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - ./server:/app
      - /app/node_modules

volumes:
  db-data:

# nginx INTERNO del contenedor `web` (Dockerfile.web). Sirve la SPA y reenvía
# /api al backend por la red de Compose. No lleva TLS: eso lo pone el nginx del
# host, que reenvía TODO a este contenedor (deploy/nginx/la-liga-acp.conf.example).
#
# Cadena de una petición:
#   navegador --https--> nginx del host --http--> web:8080 --http--> server:3001

# ---------------------------------------------------------------------------
# Cache-Control de cada respuesta, en un solo lugar.
#
# Va por `map` y no con un `add_header` en cada bloque por una regla de nginx
# que es fácil de pisar: una cabecera agregada NO se hereda en un bloque que
# tenga la suya. Con el map, el server pone las cabeceras una vez y valen para
# todas las respuestas (el include generado de las rutas no lleva ninguna).
#
# `no-store` por defecto: cualquier ruta de la app devuelve el shell, y un shell
# cacheado después de un despliegue apunta a archivos con hash QUE YA NO EXISTEN.
# /assets/ lleva hash en el nombre, así que se cachea para siempre.
map $uri $liga_cache_control {
	default    "no-store";
	~^/assets/ "public, max-age=31536000, immutable";
}

# La ruta que recibe el backend: la del cliente SIN el prefijo /api, tomada de
# $request_uri, o sea cruda (con su query y sus %xx sin decodificar). Así el
# backend ve exactamente lo que pidió el navegador, igual que con el proxy de
# Vite en desarrollo, incluido el 400 INVALID_URL_ENCODING ante un % roto.
map $request_uri $liga_api_uri {
	~^/api(?<resto>/.*)$ $resto;
	default              /;
}

server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /usr/share/nginx/html;

	# Los Location que arma nginx (el 308 de /api) salen relativos: si fueran
	# absolutos llevarían http://...:8080, que el navegador no puede alcanzar.
	absolute_redirect off;

	# Las imágenes del panel pesan hasta UPLOAD_MAX_BYTES (5 MiB) más el sobre
	# multipart. El nginx del host tiene el mismo límite.
	client_max_body_size 6m;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	server_tokens off;

	# DNS interno de Docker, re-consultado cada 10 s. El backend se resuelve en
	# cada petición (ver `set` abajo) y no una sola vez al arrancar: así nginx
	# arranca aunque `server` todavía no exista y, si el contenedor del backend
	# se recrea con otra IP, sigue llegando sin reiniciar este.
	resolver 127.0.0.11 valid=10s ipv6=off;

	add_header Cache-Control $liga_cache_control always;
	add_header X-Content-Type-Options "nosniff" always;

	# URLs desconocidas: la copia del shell, con estado 404 de verdad.
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	location = / {
		try_files /index.html =404;
	}

	location = /index.html {
		try_files /index.html =404;
	}

	location ^~ /assets/ {
		try_files $uri =404;
	}

	# Las 42 URLs de la SPA, GENERADAS en el build de la imagen desde SPA_ROUTES
	# (vite-plugins/nginx-spa-routes.ts). Sin comodín /*: lo desconocido da 404.
	include /etc/nginx/liga/spa-routes.conf;

	location = /api {
		return 308 /api/;
	}

	# La API en el mismo origen (D-006).
	location /api/ {
		set $liga_backend server:3001;
		proxy_pass http://$liga_backend$liga_api_uri;

		proxy_http_version 1.1;
		proxy_set_header Connection "";
		# El Host y el esquema que vio el nginx del host, no los de este salto.
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		# Agrega la IP del nginx del host a la que ese ya agregó (la del
		# cliente). Por eso compose.prod.yaml pone TRUST_PROXY=2: dos saltos.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# Los errores del backend pasan tal cual, con su sobre { error }.
		proxy_intercept_errors off;

		# Cabeceras propias a propósito: así el Cache-Control lo decide solo el
		# backend (30 s en /public, no-store en el resto). El nosniff del backend
		# (helmet) se oculta para que no salga repetido: queda solo este. Lo
		# mismo con su HSTS: esa política es del nginx del host, que la manda en
		# todas las respuestas; con la de helmet la API la llevaría dos veces.
		proxy_hide_header X-Content-Type-Options;
		proxy_hide_header Strict-Transport-Security;
		add_header X-Content-Type-Options "nosniff" always;

		proxy_read_timeout 120s;
	}

	# Archivos reales fuera de /assets/ (favicon.png, cursors/...).
	location / {
		try_files $uri =404;
	}
}
